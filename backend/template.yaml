AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SustainTheGlobe backend API

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: sustain-the-globe-dev

Parameters:
  ExistingUserPoolId:
    Type: String
    Default: ap-southeast-2_qYbDPKblw
    Description: ID of the existing Cognito User Pool
  ExistingUserPoolArn:
    Type: String
    Default: arn:aws:cognito-idp:ap-southeast-2:942511916226:userpool/ap-southeast-2_qYbDPKblw
    Description: ARN of the existing Cognito User Pool
  ExistingUserPoolClientId:
    Type: String
    Default: 6k68fr8g1l6dntcj9oaorvb9q1
    Description: Public app client ID for the existing Cognito User Pool

Resources:
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      # Browser SPA calls the API cross-origin: allow the auth + JSON headers.
      # No cookies/credentials mode is used; tokens travel in Authorization.
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'http://localhost:5173'"
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn: !Ref ExistingUserPoolArn

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/health.handler
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /health
            Method: get

  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sustain-the-globe-dev
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ActionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/actions.createHandler
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        CreateAction:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /actions
            Method: post
            Auth:
              Authorizer: CognitoAuth

  ActionsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/actions.listHandler
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        ListActions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /actions
            Method: get
            Auth:
              Authorizer: CognitoAuth

  PointsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/points.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        GetPoints:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /points
            Method: get
            Auth:
              Authorizer: CognitoAuth

  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Private by default: block all public access, encrypt at rest, no website hosting.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Suspended

  UploadsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/uploads.handler
      Environment:
        Variables:
          PHOTOS_BUCKET: !Ref PhotosBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref PhotosBucket
        - Statement:
            - Sid: DeleteOrphanPhotos
              Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub '${PhotosBucket.Arn}/uploads/*'
      Events:
        CreateUpload:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /uploads
            Method: post
            Auth:
              Authorizer: CognitoAuth
        DeleteUpload:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /uploads
            Method: delete
            Auth:
              Authorizer: CognitoAuth

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/me.handler
      Events:
        GetMe:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /me
            Method: get
            Auth:
              Authorizer: CognitoAuth

  LeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/leaderboard.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        GetLeaderboard:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /leaderboard
            Method: get
            Auth:
              Authorizer: CognitoAuth

Outputs:
  ApiUrl:
    Description: Base URL of the API Gateway stage
    Value: !Sub 'https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
  UserPoolId:
    Description: Cognito User Pool ID for web configuration (VITE_COGNITO_USER_POOL_ID)
    Value: !Ref ExistingUserPoolId
  UserPoolClientId:
    Description: Public SPA client ID for web configuration (VITE_COGNITO_CLIENT_ID, no secret)
    Value: !Ref ExistingUserPoolClientId
  Region:
    Description: Deployment region for web configuration (VITE_COGNITO_REGION)
    Value: !Ref AWS::Region
